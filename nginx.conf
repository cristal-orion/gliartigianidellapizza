server {
    listen 4321;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressione
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Routing statico Astro (gestisce anche /prenota -> prenota/index.html)
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache asset statici a lunga durata
    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|woff2?|ttf|otf|mp4|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
